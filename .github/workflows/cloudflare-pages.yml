# Publica web/ en Cloudflare Pages (proyecto «labodeguitadelaesquina», cuenta de IA DiarIA) en cada push a main.
# Sin compilación: se sube web/ tal cual. En Pages mandan web/_redirects y web/_headers.
# Necesita el secreto CLOUDFLARE_API_TOKEN (token con el permiso Account → Cloudflare Pages → Edit).
name: Publicar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROYECTO: labodeguitadelaesquina
  CLOUDFLARE_ACCOUNT_ID: 329655d84a22bf3d8859e456f562e83b

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que existe el token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN: no se publica en Cloudflare"; echo "hay=no" >> "$GITHUB_OUTPUT"; else echo "hay=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.hay == 'si'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.hay == 'si'
        with:
          node-version: 22

      - name: Crear el proyecto de Pages si aún no existe
        if: steps.token.outputs.hay == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -q " $PROYECTO "; then
            echo "El proyecto $PROYECTO ya existe"
          else
            npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch=main
          fi

      - name: Publicar web/
        if: steps.token.outputs.hay == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy web --project-name="$PROYECTO" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --pretty=%s | head -c 200)" --commit-dirty=true
